# 정적 파일 서빙 + Gateway 프록시.
#
# 개발 중에는 Vite 개발 서버가 같은 일을 한다 (vite.config.ts 참고).
# 둘의 동작이 갈리면 "개발에서는 되는데 배포하면 안 되는" 문제가 생긴다.

upstream gateway {
    # docker compose 네트워크 안의 서비스 이름.
    server gateway-service:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 (CLAUDE.md §26).
    # /wts/005930 같은 경로로 직접 들어와도 index.html을 내려줘야 한다.
    # 이게 없으면 새로고침할 때마다 404가 난다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 해시가 붙은 자산은 내용이 바뀌면 이름도 바뀐다. 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 실시간 시세 (CLAUDE.md §25). Upgrade 헤더를 넘겨야 핸드셰이크가 성립한다.
    location /ws/ {
        proxy_pass http://gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # 시세가 뜸한 구간에 프록시가 먼저 끊지 않도록 넉넉히 둔다.
        proxy_read_timeout 300s;
    }
}
