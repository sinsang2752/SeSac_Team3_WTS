# WTS MVP – 로컬 개발 인프라 (CLAUDE.md §32)
#
# Phase 0에서는 인프라(MySQL / Kafka / Valkey)만 컨테이너로 띄운다.
# 백엔드 서비스와 프론트엔드는 로컬 프로세스로 실행한다.
# (전체 컨테이너 실행은 MVP 후반에 추가한다)
#
#   docker compose up -d
#   docker compose --profile tools up -d   # Kafka UI 포함

name: wts

services:
  # ─────────────────────────────────────────────
  # MySQL – 거래 데이터의 Source of Truth (CLAUDE.md §10)
  # ─────────────────────────────────────────────
  mysql:
    image: mysql:8.4
    container_name: wts-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 금액은 DECIMAL을 사용한다 (CLAUDE.md §42). 부동소수 반올림 방지.
      - --sql-mode=STRICT_TRANS_TABLES,NO_ENGINE_SUBSTITUTION
      # Backend는 UTC로 저장한다 (CLAUDE.md §43)
      - --default-time-zone=+00:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wts}
      MYSQL_USER: ${MYSQL_USER:-wts}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wts}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./infra/docker/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ─────────────────────────────────────────────
  # Kafka – 이벤트 스트림 (CLAUDE.md §12, §16)
  # KRaft 단일 노드. MVP에서는 Multi-Cluster/DR을 구성하지 않는다 (§46).
  # ─────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.9.1
    container_name: wts-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: wts-local-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      # INTERNAL: 컨테이너 간 통신 / EXTERNAL: 호스트에서 실행하는 백엔드용
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s

  # ─────────────────────────────────────────────
  # Valkey – 재생성 가능한 실시간 캐시 (CLAUDE.md §11, §18)
  # 계좌/주문/원장/체결 원본은 절대 저장하지 않는다.
  # ─────────────────────────────────────────────
  valkey:
    image: valkey/valkey:8-alpine
    container_name: wts-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "no", "--save", ""]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # ─────────────────────────────────────────────
  # Kafka UI – 선택 도구 (profile: tools)
  # ─────────────────────────────────────────────
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: wts-kafka-ui
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: wts-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"

volumes:
  mysql-data:
  kafka-data:
