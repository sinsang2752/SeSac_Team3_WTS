          type: number
        quantity:
          type: integer
          format: int64
    OrderBookResponse:
      type: object
      properties:
        symbol:
          type: string
        asks:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        bids:
          type: array
          items:
            $ref: '#/components/schemas/OrderBookLevel'
        timestamp:
          type: string
          format: date-time
    OrderResponse:
      type: object
      properties:
