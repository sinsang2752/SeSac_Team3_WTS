# 이 파일은 생성물이다. 직접 고치지 말고 infra/scripts/generate-openapi.sh 를 다시 돌린다.
openapi: 3.1.0
info:
  title: WTS – 모의투자 Web Trading System API
  version: 0.0.1-SNAPSHOT
  description: '모의투자 Web Trading System API.


    클라이언트는 각 서비스를 직접 호출하지 않고 Gateway(http://localhost:8080)로만 접근한다.

    토큰은 `POST /api/users/mock-login` 으로 발급받는다.


    주문 API는 `Idempotency-Key` 헤더가 필수다. 같은 키로 같은 내용을

    재요청하면 주문이 새로 생기지 않고 기존 결과가 돌아온다.


    모든 응답에 `X-Trace-Id` 헤더가 붙는다. 에러 본문의 `traceId`와 같은 값이다.

    '
servers:
- url: http://localhost:8080
  description: Gateway
security:
- bearerAuth: []
paths:
  /api/market/stocks:
    get:
      tags:
      - stock-controller
      operationId: list
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockResponse'
        '400':
          description: 'Bad Request


            - `VALIDATION_FAILED` — 요청 값이 올바르지 않습니다.

            - `INSUFFICIENT_BALANCE` — 주문 가능한 예수금이 부족합니다.

            - `INSUFFICIENT_POSITION` — 매도 가능한 수량이 부족합니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'Unauthorized


            - `UNAUTHORIZED` — 인증이 필요합니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'Not Found


            - `USER_NOT_FOUND` — 사용자를 찾을 수 없습니다.

            - `ACCOUNT_NOT_FOUND` — 계좌를 찾을 수 없습니다.

            - `SYMBOL_NOT_FOUND` — 종목을 찾을 수 없습니다.

            - `ORDER_NOT_FOUND` — 주문을 찾을 수 없습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict


            - `INVALID_ORDER_STATE` — 현재 주문 상태에서는 처리할 수 없습니다.

            - `DUPLICATE_ORDER_REQUEST` — 같은 Idempotency-Key로 다른 주문을 요청했습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal Server Error


            - `INTERNAL_ERROR` — 일시적인 오류가 발생했습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service Unavailable


            - `MARKET_PRICE_UNAVAILABLE` — 현재가를 조회할 수 없습니다.

            - `MARKET_PRICE_STALE` — 현재가가 오래되어 주문을 처리할 수 없습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
