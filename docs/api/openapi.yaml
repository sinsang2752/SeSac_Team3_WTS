      - email
    MockLoginResponse:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
        nickname:
          type: string
        accessToken:
          type: string
        expiresInSeconds:
          type: integer
          format: int64
    OrderBookLevel:
      type: object
