          format: int64
        userId:
          type: string
        cashBalance:
          type: number
        reservedCash:
          type: number
        availableCash:
          type: number
        updatedAt:
          type: string
          format: date-time
    CandleResponse:
      type: object
      properties:
        openTime:
          type: string
          format: date-time
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: integer
          format: int64
    ErrorResponse:
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
    ExecutionResponse:
