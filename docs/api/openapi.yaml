            - `ORDER_NOT_FOUND` — 주문을 찾을 수 없습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'Conflict


            - `INVALID_ORDER_STATE` — 현재 주문 상태에서는 처리할 수 없습니다.

            - `DUPLICATE_ORDER_REQUEST` — 같은 Idempotency-Key로 다른 주문을 요청했습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'Internal Server Error


            - `INTERNAL_ERROR` — 일시적인 오류가 발생했습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 'Service Unavailable


            - `MARKET_PRICE_UNAVAILABLE` — 현재가를 조회할 수 없습니다.

            - `MARKET_PRICE_STALE` — 현재가가 오래되어 주문을 처리할 수 없습니다.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
