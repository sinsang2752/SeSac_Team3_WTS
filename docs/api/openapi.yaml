          type: integer
          format: int64
        symbol:
          type: string
        side:
          type: string
          enum:
          - BUY
          - SELL
        orderType:
          type: string
          enum:
          - MARKET
          - LIMIT
        quantity:
          type: integer
          format: int64
        limitPrice:
          type: number
        filledQuantity:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - RECEIVED
          - VALIDATED
          - ACCEPTED
          - FILLED
          - CANCELLED
          - REJECTED
        rejectReason:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlaceOrderRequest:
      type: object
      properties:
        symbol:
          type: string
          pattern: \d{6}
        side:
          type: string
          enum:
          - BUY
          - SELL
        orderType:
          type: string
          enum:
          - MARKET
          - LIMIT
        quantity:
          type: integer
          format: int64
          maximum: 1000000
          minimum: 1
        limitPrice:
          type: number
          minimum: 0
