          type: number
        quantity:
          type: integer
          format: int64
        amount:
          type: number
        fee:
          type: number
        realizedProfit:
          type: number
        executedAt:
          type: string
          format: date-time
    MockLoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 255
          minLength: 0
        nickname:
          type: string
          maxLength: 50
          minLength: 0
